name: Update Sovereign Debt Profiles

on:
  workflow_dispatch:
  schedule:
    - cron: '40 7,19 * * 1-5'

permissions:
  contents: write

concurrency:
  group: sovereign-debt-profiles-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Refresh sovereign debt profiles
        run: node scripts/update-sovereign-debt.mjs

      - name: Validate generated data
        run: |
          node - <<'NODE'
          const fs = require('fs');

          const c = JSON.parse(
            fs.readFileSync('data/catalog.json', 'utf8')
          );

          if (!Array.isArray(c.countries) || c.countries.length !== 15) {
            process.exit(1);
          }

          const usable = c.countries.filter(
            x => x.grossDebtPctGdp != null
          );

          if (usable.length < 10) {
            process.exit(1);
          }

          console.log(
            `status=${c.status}, usable=${usable.length}/${c.countries.length}`
          );

          for (const x of usable) {
            console.log(
              `${x.code}: debt=${x.grossDebtPctGdp}% GDP, 10Y=${x.y10 ?? 'n/a'}`
            );
          }
          NODE

      - name: Commit refreshed data
        shell: bash
        run: |
          if git diff --quiet -- data/; then
            echo "No sovereign-debt changes."
            exit 0
          fi

          git config user.name "bondstats-sovereign-debt-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/
          git commit -m "chore: refresh sovereign debt profiles"
          git push
